name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  APK_NAME: "basti"
  BUILD_NUMBER: ${{ github.run_number }}
  CHANGES: |
    - Secure environment handling via dotenv
    - Fixed Supabase schema permission errors
    - Supabase migrations, views and storage buckets
    - Automated build #${{ github.run_number }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create .env file from GitHub Secrets
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
          ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY=${{ secrets.ONESIGNAL_API_KEY }}
          EOF


      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.32.6"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Create key.properties
        run: |
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Verify keystore setup
        run: |
          ls -la android/app/release-key.jks
          cat android/key.properties

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          BUILD_NAME=$(echo "$APP_VERSION" | cut -d'+' -f1)
          flutter build apk --release --build-name="$BUILD_NAME" --build-number=${{ env.BUILD_NUMBER }}

      - name: Rename APK with Custom Name
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ env.APK_NAME }}-v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}-v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}.apk
          retention-days: 30

  release:
    name: Release APK
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./

      - name: List downloaded files
        run: ls -la

      - name: Extract version for release job
        id: ver
        run: |
          # Download artifact to get the APK name; version was passed via artifact filename
          ls *.apk | head -1

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ env.APP_VERSION }}"
          name: "basti v${{ env.APP_VERSION }}"
          body: |
            ${{ env.CHANGES }}

            **Build Details:**
            - Build Number: ${{ env.BUILD_NUMBER }}
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
          draft: false
          prerelease: false
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
